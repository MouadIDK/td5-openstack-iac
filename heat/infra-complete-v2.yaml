heat_template_version: 2018-08-31

description: >
  Infrastructure openstack complète: réseau privé, sous-réseau, routeur,
  instance et volume attaché (TD5 - validation production).

parameters:
  image:
    type: string
    default: cirros-0.6.3-x86_64-disk

  flavor:
    type: string
    default: m1.nano

  external_network:
    type: string
    default: public

resources:
  mon_reseau:
    type: OS::Neutron::Net
    properties:
      name: reseau-heat

  mon_sous_reseau:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-heat
      network: { get_resource: mon_reseau }
      cidr: 10.0.2.0/24
      gateway_ip: 10.0.2.1
      dns_nameservers: [8.8.8.8]

  mon_routeur:
    type: OS::Neutron::Router
    properties:
      name: routeur-heat
      external_gateway_info:
        network: { get_param: external_network }

  interface_routeur:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: mon_routeur }
      subnet: { get_resource: mon_sous_reseau }

  sg_ssh:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-ssh-heat
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress

  mon_volume:
    type: OS::Cinder::Volume
    properties:
      name: volume-heat
      size: 1
  vm1:
    type: OS::Nova::Server
    properties:
      name: vm1
      image: Fedora-Cloud-Base-37-1.7.x86_64
      flavor: m1.small
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_ssh }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        dnf install -y caddy
        mkdir -p /var/www/html
        IP=$(hostname -I | awk '{print $1}')
        echo "<h1>Serveur : VM1</h1><p>Adresse IP privee : $IP</p>" > /var/www/html/index.html
        cat > /etc/caddy/Caddyfile <<'EOF'
        :80 {
          root * /var/www/html
          file_server
        }
        EOF
        systemctl enable --now caddy

  vm2:
    type: OS::Nova::Server
    properties:
      name: vm2
      image: Fedora-Cloud-Base-37-1.7.x86_64
      flavor: m1.small
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_ssh }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        dnf install -y caddy
        mkdir -p /var/www/html
        IP=$(hostname -I | awk '{print $1}')
        echo "<h1>Serveur : VM2</h1><p>Adresse IP privee : $IP</p>" > /var/www/html/index.html
        cat > /etc/caddy/Caddyfile <<'EOF'
        :80 {
          root * /var/www/html
          file_server
        }
        EOF
        systemctl enable --now caddy
  attachement:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: mon_volume }
      instance_uuid: { get_resource: mon_instance }

outputs:
  instance_ip:
    description: IP privée de l'instance
    value: { get_attr: [mon_instance, first_address] }

  instance_id:
    description: ID de l'instance
    value: { get_resource: mon_instance }
