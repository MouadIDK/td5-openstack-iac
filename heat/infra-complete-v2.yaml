heat_template_version: 2018-08-31

description: >
  TD5 Exercice 2 - Deux serveurs Web Caddy derriere
  un load balancer Octavia en ROUND_ROBIN.

parameters:
  web_image:
    type: string
    default: Fedora-Cloud-Base-37-1.7.x86_64

  web_flavor:
    type: string
    default: m1.heat_int

  external_network:
    type: string
    default: public

resources:

  # =========================================================
  # RESEAU PRIVE
  # =========================================================

  mon_reseau:
    type: OS::Neutron::Net
    properties:
      name: reseau-heat

  mon_sous_reseau:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-heat
      network: { get_resource: mon_reseau }
      cidr: 10.0.2.0/24
      gateway_ip: 10.0.2.1
      dns_nameservers:
        - 8.8.8.8

  # =========================================================
  # ROUTEUR VERS LE RESEAU PUBLIC
  # =========================================================

  mon_routeur:
    type: OS::Neutron::Router
    properties:
      name: routeur-heat
      external_gateway_info:
        network: { get_param: external_network }

  interface_routeur:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: mon_routeur }
      subnet: { get_resource: mon_sous_reseau }

  # =========================================================
  # SECURITY GROUP
  # SSH + HTTP
  # =========================================================

  sg_ssh:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-web-heat
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress

        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
          direction: ingress

        - protocol: icmp
          direction: ingress

  # =========================================================
  # VM1
  # =========================================================

  vm1:
    type: OS::Nova::Server
    depends_on: interface_routeur
    properties:
      name: vm1
      image: { get_param: web_image }
      flavor: { get_param: web_flavor }

      networks:
        - network: { get_resource: mon_reseau }

      security_groups:
        - { get_resource: sg_ssh }

      user_data_format: RAW
      user_data: |
        #!/bin/bash

        # Attendre que le reseau soit disponible
        sleep 10

        dnf install -y caddy

        mkdir -p /var/www/html

        IP=$(hostname -I | awk '{print $1}')

        cat > /var/www/html/index.html <<EOF
        <html>
        <body>
        <h1>Serveur : VM1</h1>
        <p>Adresse IP privee : $IP</p>
        </body>
        </html>
        EOF

        cat > /etc/caddy/Caddyfile <<'EOF'
        :80 {
          root * /var/www/html
          file_server
        }
        EOF

        systemctl enable caddy
        systemctl restart caddy

  # =========================================================
  # VM2
  # =========================================================

  vm2:
    type: OS::Nova::Server
    depends_on: interface_routeur
    properties:
      name: vm2
      image: { get_param: web_image }
      flavor: { get_param: web_flavor }

      networks:
        - network: { get_resource: mon_reseau }

      security_groups:
        - { get_resource: sg_ssh }

      user_data_format: RAW
      user_data: |
        #!/bin/bash

        # Attendre que le reseau soit disponible
        sleep 10

        dnf install -y caddy

        mkdir -p /var/www/html

        IP=$(hostname -I | awk '{print $1}')

        cat > /var/www/html/index.html <<EOF
        <html>
        <body>
        <h1>Serveur : VM2</h1>
        <p>Adresse IP privee : $IP</p>
        </body>
        </html>
        EOF

        cat > /etc/caddy/Caddyfile <<'EOF'
        :80 {
          root * /var/www/html
          file_server
        }
        EOF

        systemctl enable caddy
        systemctl restart caddy

  # =========================================================
  # LOAD BALANCER OCTAVIA
  # =========================================================

  load_balancer:
    type: OS::Octavia::LoadBalancer
    properties:
      name: lb-web
      vip_subnet: { get_resource: mon_sous_reseau }

  # =========================================================
  # LISTENER HTTP PORT 80
  # =========================================================

  listener_http:
    type: OS::Octavia::Listener
    properties:
      name: listener-http
      loadbalancer: { get_resource: load_balancer }
      protocol: HTTP
      protocol_port: 80

  # =========================================================
  # POOL ROUND_ROBIN
  # =========================================================

  pool_http:
    type: OS::Octavia::Pool
    properties:
      name: pool-web
      listener: { get_resource: listener_http }
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN

  # =========================================================
  # VM1 MEMBRE DU POOL
  # =========================================================

  membre_vm1:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool_http }
      address: { get_attr: [vm1, first_address] }
      protocol_port: 80
      subnet: { get_resource: mon_sous_reseau }

  # =========================================================
  # VM2 MEMBRE DU POOL
  # =========================================================

  membre_vm2:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool_http }
      address: { get_attr: [vm2, first_address] }
      protocol_port: 80
      subnet: { get_resource: mon_sous_reseau }

  # =========================================================
  # IP FLOTTANTE DU LOAD BALANCER
  # =========================================================

  lb_floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on:
      - interface_routeur
      - load_balancer
    properties:
      floating_network: { get_param: external_network }
      port_id: { get_attr: [load_balancer, vip_port_id] }


# =========================================================
# OUTPUTS
# =========================================================

outputs:

  # Gardes pour le workflow iac-pr existant
  instance_ip:
    description: IP privee de VM1
    value: { get_attr: [vm1, first_address] }

  instance_id:
    description: ID de VM1
    value: { get_resource: vm1 }

  vm1_ip:
    description: IP privee de VM1
    value: { get_attr: [vm1, first_address] }

  vm2_ip:
    description: IP privee de VM2
    value: { get_attr: [vm2, first_address] }

  lb_vip:
    description: VIP privee du load balancer Octavia
    value: { get_attr: [load_balancer, vip_address] }

  lb_floating_ip:
    description: IP flottante publique du load balancer
    value: { get_attr: [lb_floating_ip, floating_ip_address] }
